name: tests

on:
  push:
  pull_request:

jobs:
  selftests:
    # Apple Silicon runner: mflux/MLX require arm64 macOS.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mflux
        run: pip install "mflux>=0.18.0"
      - name: Dispatch + capability self-tests
        run: python tests/test_dispatch.py
      - name: Sampler self-tests
        run: python tests/test_sampler.py

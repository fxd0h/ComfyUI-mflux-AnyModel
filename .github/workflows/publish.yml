name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"   # bump the version here to trigger a publish

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish custom node to the registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'fxd0h' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
